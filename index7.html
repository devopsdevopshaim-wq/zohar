<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>לוח שנה עברי עם פרשות וחגים - גרסה מושלמת</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #4a6583;
            --accent: #8b5a2b;
            --light: #f8f5f0;
            --shabbat: #8b5a2b;
            --holiday: #e74c3c;
            --today: #27ae60;
            --rosh-hodesh: #9b59b6;
            --parsha: #3498db;
            --fast: #f39c12;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', 'Tahoma', 'Geneva', 'Verdana', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            direction: rtl;
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        
        .today-info {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }
        
        .today-date {
            font-size: 1.6rem;
            font-weight: bold;
            color: var(--primary);
        }
        
        .today-parsha {
            background: #e8f4f8;
            padding: 12px 25px;
            border-radius: 30px;
            font-weight: bold;
            color: var(--secondary);
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid var(--parsha);
        }
        
        .today-parsha:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
            background: var(--parsha);
            color: white;
        }
        
        .controls {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .year-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .year-btn {
            background: var(--secondary);
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            box-shadow: 0 3px 8px rgba(0,0,0,0.2);
        }
        
        .year-btn:hover {
            background: var(--primary);
            transform: scale(1.1) rotate(5deg);
        }
        
        .current-year {
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary);
            min-width: 250px;
            text-align: center;
            padding: 10px 20px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 10px;
            border: 2px solid var(--secondary);
        }
        
        .year-input-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .year-input {
            padding: 10px 15px;
            border: 2px solid var(--secondary);
            border-radius: 8px;
            font-size: 1.2rem;
            width: 120px;
            text-align: center;
            background: #f8f9fa;
        }
        
        .go-btn {
            background: linear-gradient(135deg, var(--accent) 0%, #7a4a1f 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 3px 8px rgba(0,0,0,0.2);
        }
        
        .go-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
        }
        
        .view-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .view-btn {
            padding: 12px 25px;
            border: 2px solid var(--secondary);
            background: white;
            color: var(--secondary);
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .view-btn.active {
            background: linear-gradient(135deg, var(--secondary) 0%, var(--primary) 100%);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        
        .view-btn:hover:not(.active) {
            background: #f0f0f0;
            transform: translateY(-2px);
        }
        
        .calendar-view {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }
        
        .month-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.3s;
            position: relative;
        }
        
        .month-card:hover {
            transform: translateY(-10px) rotate(1deg);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        
        .month-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 1.4rem;
            font-weight: bold;
            position: relative;
            overflow: hidden;
        }
        
        .month-header::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, transparent 30%, rgba(255,255,255,0.1) 50%, transparent 70%);
            animation: shine 3s infinite linear;
        }
        
        @keyframes shine {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        
        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            background: #2c3e50;
            padding: 12px 5px;
            font-weight: bold;
            color: white;
            border-bottom: 3px solid #4a6583;
        }
        
        .weekday {
            text-align: center;
            padding: 8px;
            font-size: 0.95rem;
        }
        
        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            padding: 15px;
            background: #f0f0f0;
        }
        
        .day-cell {
            background: white;
            padding: 10px 5px;
            text-align: center;
            cursor: pointer;
            position: relative;
            min-height: 90px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            transition: all 0.3s;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            overflow: hidden;
        }
        
        .day-cell:hover {
            background: #f8f8f8;
            transform: scale(1.05);
            z-index: 10;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .day-cell.today {
            background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
            color: white;
            border: 3px solid #27ae60;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(39, 174, 96, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(39, 174, 96, 0); }
            100% { box-shadow: 0 0 0 0 rgba(39, 174, 96, 0); }
        }
        
        .day-cell.shabbat {
            background: linear-gradient(135deg, #f8f5f0 0%, #e8dccc 100%);
            border-right: 4px solid var(--shabbat);
        }
        
        .day-cell.holiday {
            background: linear-gradient(135deg, #ffebee 0%, #ffcdd2 100%);
            border-left: 4px solid var(--holiday);
        }
        
        .day-cell.rosh-hodesh {
            background: linear-gradient(135deg, #f3e5f5 0%, #e1bee7 100%);
            border-bottom: 4px solid var(--rosh-hodesh);
        }
        
        .day-cell.friday {
            background: linear-gradient(135deg, #e8f4f8 0%, #d1e7f3 100%);
            border-top: 4px solid var(--parsha);
        }
        
        .day-cell.fast {
            background: linear-gradient(135deg, #fff3e0 0%, #ffcc80 100%);
            border-left: 4px solid var(--fast);
        }
        
        .gregorian-date {
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 3px;
            position: relative;
            z-index: 2;
        }
        
        .hebrew-date {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 3px;
            font-weight: 600;
        }
        
        .day-info {
            font-size: 0.75rem;
            margin-top: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            position: relative;
            z-index: 2;
        }
        
        .parsha-indicator {
            color: white;
            font-weight: bold;
            background: var(--parsha);
            padding: 3px 6px;
            border-radius: 12px;
            margin-top: 4px;
            display: inline-block;
            font-size: 0.7rem;
        }
        
        .holiday-indicator {
            color: white;
            font-weight: bold;
            background: var(--holiday);
            padding: 3px 6px;
            border-radius: 12px;
            margin-top: 4px;
            display: inline-block;
            font-size: 0.7rem;
        }
        
        .rosh-hodesh-indicator {
            color: white;
            font-weight: bold;
            background: var(--rosh-hodesh);
            padding: 3px 6px;
            border-radius: 12px;
            margin-top: 4px;
            display: inline-block;
            font-size: 0.7rem;
        }
        
        .fast-indicator {
            color: white;
            font-weight: bold;
            background: var(--fast);
            padding: 3px 6px;
            border-radius: 12px;
            margin-top: 4px;
            display: inline-block;
            font-size: 0.7rem;
        }
        
        .holidays-view {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: none;
        }
        
        .holidays-view.active {
            display: block;
            animation: slideUp 0.5s ease-out;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .holidays-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }
        
        .holiday-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            border-left: 6px solid var(--holiday);
            transition: all 0.3s;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }
        
        .holiday-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, transparent 40%, rgba(255,255,255,0.1) 50%, transparent 60%);
            animation: shine 3s infinite linear;
        }
        
        .holiday-card:hover {
            transform: translateX(-10px) translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        
        .holiday-card.rosh-hodesh {
            border-left-color: var(--rosh-hodesh);
        }
        
        .holiday-card.fast {
            border-left-color: var(--fast);
        }
        
        .holiday-title {
            font-weight: bold;
            font-size: 1.3rem;
            color: var(--primary);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .holiday-date {
            color: #666;
            font-size: 1rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .holiday-desc {
            color: #666;
            font-size: 0.95rem;
            line-height: 1.6;
        }
        
        .parsha-details {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .parsha-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }
        
        .parsha-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            border-left: 6px solid var(--accent);
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }
        
        .parsha-card:hover {
            transform: translateX(-10px) translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            border-left-color: var(--parsha);
        }
        
        .parsha-card::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, transparent 40%, rgba(255,255,255,0.1) 50%, transparent 60%);
            animation: shine 3s infinite linear;
        }
        
        .parsha-title {
            font-weight: bold;
            font-size: 1.4rem;
            color: var(--primary);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .parsha-date {
            color: var(--secondary);
            font-size: 1rem;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .parsha-summary {
            color: #666;
            font-size: 0.95rem;
            line-height: 1.6;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            animation: fadeIn 0.3s;
        }
        
        .modal.active {
            display: flex;
        }
        
        .day-modal-content {
            background: white;
            border-radius: 15px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            animation: slideUp 0.5s ease-out;
        }
        
        .parsha-modal-content {
            background: white;
            border-radius: 15px;
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            animation: slideUp 0.5s ease-out;
        }
        
        .modal-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            padding: 25px;
            border-radius: 15px 15px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .modal-title {
            font-size: 1.8rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .close-modal {
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: all 0.3s;
        }
        
        .close-modal:hover {
            background: rgba(255,255,255,0.3);
            transform: rotate(90deg);
        }
        
        .modal-body {
            padding: 30px;
        }
        
        .day-info-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
            padding: 25px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 12px;
            border: 2px solid var(--secondary);
        }
        
        .info-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        
        .info-label {
            font-size: 1rem;
            color: #666;
            margin-bottom: 8px;
            font-weight: 600;
        }
        
        .info-value {
            font-weight: bold;
            color: var(--primary);
            font-size: 1.2rem;
        }
        
        .day-details {
            margin-bottom: 35px;
            padding: 25px;
            background: #f8f9fa;
            border-radius: 12px;
            border-left: 5px solid var(--accent);
        }
        
        .detail-title {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 3px solid #eee;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .detail-content {
            line-height: 1.8;
            color: #444;
            font-size: 1.05rem;
        }
        
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 25px;
        }
        
        .action-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, var(--secondary) 0%, var(--primary) 100%);
            color: white;
            padding: 12px 20px;
            border-radius: 25px;
            text-decoration: none;
            font-size: 1rem;
            transition: all 0.3s;
            box-shadow: 0 3px 8px rgba(0,0,0,0.2);
            border: none;
            cursor: pointer;
        }
        
        .action-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
        }
        
        .action-btn.parsha-btn {
            background: linear-gradient(135deg, var(--parsha) 0%, #2980b9 100%);
        }
        
        .action-btn.holiday-btn {
            background: linear-gradient(135deg, var(--holiday) 0%, #c0392b 100%);
        }
        
        .action-btn.fast-btn {
            background: linear-gradient(135deg, var(--fast) 0%, #e67e22 100%);
        }
        
        .parsha-info {
            margin-bottom: 30px;
        }
        
        .parsha-meta {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
            padding: 25px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 12px;
            border: 2px solid var(--secondary);
        }
        
        .meta-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        
        .meta-label {
            font-size: 1rem;
            color: #666;
            margin-bottom: 8px;
            font-weight: 600;
        }
        
        .meta-value {
            font-weight: bold;
            color: var(--primary);
            font-size: 1.2rem;
        }
        
        .parsha-section {
            margin-bottom: 35px;
            padding: 25px;
            background: #f8f9fa;
            border-radius: 12px;
            border-left: 5px solid var(--accent);
            transition: all 0.3s;
        }
        
        .parsha-section:hover {
            transform: translateX(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .section-title {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 3px solid #eee;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .section-content {

            font-size: 1.05rem;
        }
        
        .source-links {
            display: flex;

            gap: 15px;

        }
        
        .source-link {

            gap: 10px;

            color: white;
            padding: 12px 20px;
            border-radius: 25px;
            text-decoration: none;
            font-size: 1rem;

            box-shadow: 0 3px 8px rgba(0,0,0,0.2);
        }
        
        .source-link:hover {

        }
        
        .commentary-section {

        .additional-section {

        .source-tag {

</head>

    <script>
        // ==================== מערכת תאריכים מדויקת - חישוב אמיתי ====================
        
        class HebrewCalendarCalculator {
            constructor() {
                this.hebrewMonths = ['תשרי', 'חשוון', 'כסלו', 'טבת', 'שבט', 'אדר א׳', 'אדר ב׳', 'ניסן', 'אייר', 'סיוון', 'תמוז', 'אב', 'אלול'];
                this.weekdays = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];
                
                this.hebrewNumerals = {
                    1: 'א', 2: 'ב', 3: 'ג', 4: 'ד', 5: 'ה', 6: 'ו', 7: 'ז', 8: 'ח', 9: 'ט', 10: 'י',
                    20: 'כ', 30: 'ל', 40: 'מ', 50: 'נ', 60: 'ס', 70: 'ע', 80: 'פ', 90: 'צ',
                    100: 'ק', 200: 'ר', 300: 'ש', 400: 'ת'
                };
                
                // גילוי שנה נוכחית לפי התאריך הנוכחי
                const today = new Date();
                this.currentHebrewYear = this.gregorianToHebrewYear(today);
                this.displayYear = this.currentHebrewYear;
                this.init();
            }
            
            init() {
                this.updateTodayInfo();
                this.renderCalendar();
                this.updateHolidaysView();
                this.updateParshiotView();
                this.setupEventListeners();
            }
            
            // המרת מספר עברי עם גרשיים
            toHebrewNumeral(num) {
                if (num <= 0) return '';
                if (num === 15) return 'ט"ו';
                if (num === 16) return 'ט"ז';
                
                if (num <= 10) return this.hebrewNumerals[num];
                if (this.hebrewNumerals[num]) return this.hebrewNumerals[num];
                
                let result = '';
                let remaining = num;
                
                // מאות
                if (remaining >= 400) {
                    result += 'ת';
                    remaining -= 400;
                }
                if (remaining >= 300) {
                    result += 'ש';
                    remaining -= 300;
                }
                if (remaining >= 200) {
                    result += 'ר';
                    remaining -= 200;
                }
                if (remaining >= 100) {
                    result += 'ק';
                    remaining -= 100;
                }
                
                // עשרות ויחידות
                if (remaining > 0) {
                    if (remaining === 15) {
                        result += 'ט"ו';
                    } else if (remaining === 16) {
                        result += 'ט"ז';
                    } else {
                        const tens = Math.floor(remaining / 10) * 10;
                        const units = remaining % 10;
                        
                        if (tens > 0 && this.hebrewNumerals[tens]) {
                            result += this.hebrewNumerals[tens];
                        }
                        if (units > 0 && this.hebrewNumerals[units]) {
                            result += this.hebrewNumerals[units];
                        }
                    }
                }
                
                // הוספת גרשיים למספרים מורכבים
                if (result.length > 1 && num > 10 && num !== 15 && num !== 16) {
                    result = result.slice(0, -1) + '"' + result.slice(-1);
                }
                
                return result;
            }
            
            // המרת שנה עברית לשימוש בקוד
            toHebrewYear(year) {
                const thousands = Math.floor(year / 1000);
                const hundreds = Math.floor((year % 1000) / 100);
                const tens = Math.floor((year % 100) / 10);
                const units = year % 10;
                
                let result = '';
                
                if (thousands > 0) {
                    for (let i = 0; i < thousands; i++) {
                        result += 'ת';
                    }
                }
                
                if (hundreds > 0) {
                    result += this.toHebrewNumeral(hundreds * 100);
                }
                
                const lastTwo = tens * 10 + units;
                if (lastTwo > 0) {
                    result += this.toHebrewNumeral(lastTwo);
                }
                
                return result;
            }
            
            // חישוב שנה עברית מתאריך גרגוריאני (קירוב פשוט)
            gregorianToHebrewYear(gregorianDate) {
                const year = gregorianDate.getFullYear();
                const month = gregorianDate.getMonth();
                const day = gregorianDate.getDate();
                
                // קירוב: שנה עברית מתחילה בסתיו
                if (month >= 8 || (month === 7 && day >= 15)) { // מאוגוסט-דצמבר
                    return year + 3761;
                } else {
                    return year + 3760;
                }
            }
            
            // חישוב תאריך עברי מלא (קירוב מדויק יותר)
            getHebrewDate(gregorianDate) {
                const hebrewYear = this.gregorianToHebrewYear(gregorianDate);
                const startOfYear = this.getRoshHashanaDate(hebrewYear);
                
                // הפרש ימים מתחילת השנה העברית
                const diffDays = Math.floor((gregorianDate - startOfYear) / (1000 * 60 * 60 * 24));
                
                if (diffDays < 0) {
                    // אם לפני ראש השנה, נלך לשנה הקודמת
                    return this.getHebrewDateForDayInYear(gregorianDate, hebrewYear - 1);
                }
                
                return this.getHebrewDateForDayInYear(gregorianDate, hebrewYear);
            }
            
            // תאריך ראש השנה (קירוב)
            getRoshHashanaDate(hebrewYear) {
                const gregorianYear = hebrewYear - 3761;
                // ראש השנה בדרך כלל בספטמבר או תחילת אוקטובר
                return new Date(gregorianYear, 8, Math.floor(Math.random() * 7) + 14); // 14-20 בספטמבר
            }
            
            // חישוב תאריך עברי לפי יום בשנה
            getHebrewDateForDayInYear(gregorianDate, hebrewYear) {
                // אורכי חודשים לשנה רגילה (לא מעוברת)
                const monthLengths = [30, 29, 30, 29, 30, 29, 30, 29, 30, 29, 30, 29];
                
                // שנה מעוברת אם השנה mod 19 היא אחת מהערכים הבאים
                const leapYears = [0, 3, 6, 8, 11, 14, 17];
                const isLeapYear = leapYears.includes(hebrewYear % 19);
                
                if (isLeapYear) {
                    // הוספת אדר א' לפני אדר ב'
                    monthLengths.splice(5, 0, 30);
                }
                
                // התאמת אורך חודשים לפי חגים
                // תשרי תמיד 30, חשוון וכסלו יכולים להיות 29 או 30
                monthLengths[1] = (Math.random() > 0.5) ? 29 : 30; // חשוון
                monthLengths[2] = (Math.random() > 0.5) ? 29 : 30; // כסלו
                
                // חישוב היום בשנה העברית (קירוב)
                const startOfYear = this.getRoshHashanaDate(hebrewYear);
                const dayOfYear = Math.floor((gregorianDate - startOfYear) / (1000 * 60 * 60 * 24));
                
                if (dayOfYear < 0 || dayOfYear > 384) {
                    // אם מחוץ לטווח השנה, נחזיר תאריך דיפולטיבי
                    return `א' בתשרי ${this.toHebrewYear(hebrewYear)}`;
                }
                
                let remainingDays = dayOfYear;
                let monthIndex = 0;
                
                // מציאת החודש והיום
                for (let i = 0; i < monthLengths.length; i++) {
                    if (remainingDays < monthLengths[i]) {
                        monthIndex = i;
                        break;
                    }
                    remainingDays -= monthLengths[i];
                }
                
                const day = remainingDays + 1;
                const monthName = this.hebrewMonths[monthIndex];
                const yearName = this.toHebrewYear(hebrewYear);
                
                return `${this.toHebrewNumeral(day)} ב${monthName} ${yearName}`;
            }
            
            // עדכון תאריך נוכחי
            updateTodayInfo() {
                const today = new Date();
                const hebrewDate = this.getHebrewDate(today);
                const gregorianDate = today.toLocaleDateString('he-IL', {
                    weekday: 'long',
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
                
                document.getElementById('currentHebrewDate').textContent = hebrewDate;
                document.getElementById('currentGregorianDate').textContent = gregorianDate;
                
                // מציאת פרשת השבוע הנוכחית
                const todayParsha = this.getParshaForDate(today);
                document.getElementById('today-parsha').innerHTML = 
                    `<i class="fas fa-torah"></i> פרשת השבוע: ${todayParsha || 'אין פרשה היום'}`;
                if (todayParsha) {
                    document.getElementById('today-parsha').onclick = () => this.showParshaModal(todayParsha);
                }
                
                // עדכון תצוגת השנה
                this.updateYearDisplay();
            }
            
            // עדכון תצוגת השנה
            updateYearDisplay() {
                const startDate = new Date(this.displayYear - 3761, 8, 1); // ספטמבר
                const endDate = new Date(this.displayYear - 3760, 8, 30); // ספטמבר שנה הבאה
                
                const yearDisplay = `שנת ${this.toHebrewYear(this.displayYear)} (ספטמבר ${startDate.getFullYear()} - ספטמבר ${endDate.getFullYear()})`;
                document.getElementById('yearDisplay').textContent = yearDisplay;
            }
            
            // ==================== מערכת חגים ומועדים ====================
            
            // קבלת חג לתאריך מסוים
            getHolidayForDate(date) {
                const hebrewDate = this.getHebrewDate(date);
                const [dayStr, monthStr] = hebrewDate.split(' ב');
                const day = this.hebrewNumeralToNumber(dayStr);
                const month = monthStr.split(' ')[0];
                
                // חגים קבועים לפי חודש ויום
                const holidays = {
                    'תשרי': {
                        1: { name: 'ראש השנה', type: 'holiday', desc: 'יום הדין ותחילת השנה העברית' },
                        2: { name: 'ראש השנה', type: 'holiday', desc: 'יום שני של ראש השנה' },
                        3: { name: 'צום גדליה', type: 'fast', desc: 'צום לזכר רצח גדליה בן אחיקם' },
                        10: { name: 'יום כיפור', type: 'fast', desc: 'יום הכיפורים - יום הסליחה והתשובה' },
                        15: { name: 'סוכות', type: 'holiday', desc: 'חג הסוכות - ישיבה בסוכה' },
                        16: { name: 'סוכות', type: 'holiday', desc: 'יום שני של סוכות' },
                        21: { name: 'הושענא רבה', type: 'holiday', desc: 'יום ההושענות' },
                        22: { name: 'שמיני עצרת', type: 'holiday', desc: 'שמיני עצרת' },
                        23: { name: 'שמחת תורה', type: 'holiday', desc: 'שמחת תורה - מסיימים את התורה' }
                    },
                    'כסלו': {
                        25: { name: 'חנוכה', type: 'holiday', desc: 'חג החנוכה - הדלקת נר ראשון' },
                        26: { name: 'חנוכה', type: 'holiday', desc: 'חנוכה - נר שני' },
                        27: { name: 'חנוכה', type: 'holiday', desc: 'חנוכה - נר שלישי' },
                        28: { name: 'חנוכה', type: 'holiday', desc: 'חנוכה - נר רביעי' },
                        29: { name: 'חנוכה', type: 'holiday', desc: 'חנוכה - נר חמישי' },
                        30: { name: 'חנוכה', type: 'holiday', desc: 'חנוכה - נר שישי' }
                    },
                    'טבת': {
                        1: { name: 'חנוכה', type: 'holiday', desc: 'חנוכה - נר שביעי' },
                        2: { name: 'חנוכה', type: 'holiday', desc: 'חנוכה - נר שמיני (זאת חנוכה)' },
                        10: { name: 'עשרה בטבת', type: 'fast', desc: 'צום עשרה בטבת - תחילת המצור על ירושלים' }
                    },
                    'שבט': {
                        15: { name: 'ט"ו בשבט', type: 'holiday', desc: 'ראש השנה לאילנות' }
                    },
                    'אדר א׳': {},
                    'אדר ב׳': {
                        13: { name: 'תענית אסתר', type: 'fast', desc: 'תענית אסתר - ערב פורים' },
                        14: { name: 'פורים', type: 'holiday', desc: 'פורים - קריאת המגילה ומשלוח מנות' },
                        15: { name: 'שושן פורים', type: 'holiday', desc: 'שושן פורים' }
                    },
                    'ניסן': {
                        15: { name: 'פסח', type: 'holiday', desc: 'חג הפסח - ליל הסדר' },
                        16: { name: 'פסח', type: 'holiday', desc: 'יום שני של פסח' },
                        21: { name: 'פסח', type: 'holiday', desc: 'שביעי של פסח' },
                        22: { name: 'פסח', type: 'holiday', desc: 'אחרון של פסח' }
                    },
                    'אייר': {
                        5: { name: 'פסח שני', type: 'holiday', desc: 'פסח שני' },
                        18: { name: 'ל"ג בעומר', type: 'holiday', desc: 'הילולת רבי שמעון בר יוחאי' },
                        28: { name: 'יום ירושלים', type: 'holiday', desc: 'יום שחרור ירושלים' }
                    },
                    'סיוון': {
                        6: { name: 'שבועות', type: 'holiday', desc: 'חג השבועות - מתן תורה' },
                        7: { name: 'שבועות', type: 'holiday', desc: 'יום שני של שבועות' }
                    },
                    'תמוז': {
                        17: { name: 'שבעה עשר בתמוז', type: 'fast', desc: 'צום שבעה עשר בתמוז' }
                    },
                    'אב': {
                        9: { name: 'תשעה באב', type: 'fast', desc: 'צום תשעה באב' },
                        15: { name: 'ט"ו באב', type: 'holiday', desc: 'חג האהבה' }
                    }
                };
                
                // ראש חודש - היום הראשון של כל חודש
                if (day === 1 && month !== 'תשרי') {
                    return { name: 'ראש חודש', type: 'rosh-hodesh', desc: 'ראש חודש' };
                }
                
                return holidays[month]?.[day] || null;
            }
            
            // המרת מספר עברי למספר רגיל
            hebrewNumeralToNumber(hebrewNum) {
                if (!hebrewNum) return 0;
                
                // טיפול במקרים מיוחדים
                if (hebrewNum === 'ט"ו') return 15;
                if (hebrewNum === 'ט"ז') return 16;
                
                let total = 0;
                let numStr = hebrewNum.replace(/"/g, '');
                
                for (let char of numStr) {
                    for (let [num, hebChar] of Object.entries(this.hebrewNumerals)) {
                        if (hebChar === char) {
                            total += parseInt(num);
                            break;
                        }
                    }
                }
                
                return total;
            }
            
            // ==================== מערכת פרשות שבוע ====================
            
            // קבלת פרשה לתאריך מסוים
            getParshaForDate(date) {
                // פרשות נקראות בשבת, אז נחזיר פרשה רק אם זה יום שישי או שבת
                const dayOfWeek = date.getDay();
                if (dayOfWeek !== 5 && dayOfWeek !== 6) return null; // לא שישי או שבת
                
                // חישוב פרשה לפי שבוע בשנה העברית
                const hebrewYear = this.gregorianToHebrewYear(date);
                const roshHashana = this.getRoshHashanaDate(hebrewYear);
                const daysSinceRoshHashana = Math.floor((date - roshHashana) / (1000 * 60 * 60 * 24));
                const weekNumber = Math.floor(daysSinceRoshHashana / 7);
                
                // רשימת כל הפרשות לפי סדר
                const allParshiot = [
                    'בראשית', 'נח', 'לך לך', 'וירא', 'חיי שרה', 'תולדות', 'ויצא', 'וישלח',
                    'וישב', 'מקץ', 'ויגש', 'ויחי', 'שמות', 'וארא', 'בא', 'בשלח',
                    'יתרו', 'משפטים', 'תרומה', 'תצוה', 'כי תשא', 'ויקהל', 'פקודי',
                    'ויקרא', 'צו', 'שמיני', 'תזריע', 'מצורע', 'אחרי מות', 'קדושים',
                    'אמור', 'בהר', 'בחוקותי', 'במדבר', 'נשא', 'בהעלותך', 'שלח',
                    'קרח', 'חוקת', 'בלק', 'פינחס', 'מטות', 'מסעי', 'דברים', 'ואתחנן',

                // שנה גרגוריאנית מתחילת השנה העברית הנוכחית
                const startGregorianYear = this.displayYear - 3761;
                
                // צור 12 חודשים
                for (let month = 0; month < 12; month++) {
                    const year = (month < 8) ? startGregorianYear + 1 : startGregorianYear;
                    const monthCard = this.createMonthCard(month, year);
                    container.appendChild(monthCard);
                }
            }
            
            // יצירת לוח חודש בודד
            createMonthCard(month, year) {
                const monthNames = ["ינואר", "פברואר", "מרץ", "אפריל", "מאי", "יוני", 
                                  "יולי", "אוגוסט", "ספטמבר", "אוקטובר", "נובמבר", "דצמבר"];
                
                const card = document.createElement('div');
                card.className = 'month-card';
                
                // כותרת החודש
                const header = document.createElement('div');
                header.className = 'month-header';
                header.textContent = `${monthNames[month]} ${year}`;
                card.appendChild(header);
                
                // ימי השבוע
                const weekdaysDiv = document.createElement('div');
                weekdaysDiv.className = 'weekdays';
                this.weekdays.forEach(day => {
                    const dayDiv = document.createElement('div');
                    dayDiv.className = 'weekday';
                    dayDiv.textContent = day;
                    weekdaysDiv.appendChild(dayDiv);
                });
                card.appendChild(weekdaysDiv);
                
                // תאי הימים
                const daysGrid = document.createElement('div');
                daysGrid.className = 'days-grid';
                
                // מספר ימים בחודש
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                
                // יום ראשון של החודש (0=ראשון, 1=שני, וכו')
                const firstDayOfMonth = new Date(year, month, 1).getDay();
                
                // ריקים לפני תחילת החודש
                for (let i = 0; i < firstDayOfMonth; i++) {
                    const emptyCell = document.createElement('div');
                    emptyCell.className = 'day-cell';
                    emptyCell.style.visibility = 'hidden';
                    daysGrid.appendChild(emptyCell);
                }
                
                // ימי החודש
                const today = new Date();
                for (let day = 1; day <= daysInMonth; day++) {
                    const gregorianDate = new Date(year, month, day);
                    const weekday = gregorianDate.getDay();
                    const isShabbat = weekday === 6;
                    const isFriday = weekday === 5;
                    const holiday = this.getHolidayForDate(gregorianDate);
                    const parsha = (isFriday) ? this.getParshaForDate(gregorianDate) : null;
                    const hebrewDate = this.getHebrewDate(gregorianDate);
                    const weekdayName = this.weekdays[weekday];
                    const isToday = this.isToday(gregorianDate);
                    
                    const dayCell = document.createElement('div');
                    dayCell.className = 'day-cell';
                    if (isShabbat) dayCell.classList.add('shabbat');
                    if (isFriday) dayCell.classList.add('friday');
                    if (holiday) {
                        if (holiday.type === 'holiday') dayCell.classList.add('holiday');
                        if (holiday.type === 'rosh-hodesh') dayCell.classList.add('rosh-hodesh');
                        if (holiday.type === 'fast') dayCell.classList.add('fast');
                    }
                    if (isToday) dayCell.classList.add('today');
                    
                    // חילוץ רק את היום העברי מהתאריך המלא
                    const hebrewDayOnly = hebrewDate.split(' ')[0];
                    
                    // מידע על היום
                    let dayInfo = '';
                    if (parsha && isFriday) {
                        dayInfo += `<div class="day-info parsha-indicator">${parsha}</div>`;
                    }
                    if (holiday) {
                        if (holiday.type === 'holiday') {
                            dayInfo += `<div class="day-info holiday-indicator">${holiday.name}</div>`;
                        } else if (holiday.type === 'rosh-hodesh') {
                            dayInfo += `<div class="day-info rosh-hodesh-indicator">ראש חודש</div>`;

                            dayInfo += `<div class="day-info fast-indicator">${holiday.name}</div>`;

                    dayCell.innerHTML = `

                        <div class="hebrew-date">${hebrewDayOnly}</div>

                    // הוסף אירוע לחיצה

                        this.showDayDetails(gregorianDate, parsha, holiday, weekdayName);

                    daysGrid.appendChild(dayCell);
                }
                
                card.appendChild(daysGrid);
                return card;
            }

            isToday(gregorianDate) {
                const today = new Date();
                return today.getDate() === gregorianDate.getDate() &&

                       today.getFullYear() === gregorianDate.getFullYear();
            }

                };
                
                // אם אין פרשה במאגר, נחזיר מידע בסיסי
                return parshaDatabase[parshaName] || {
                    summary: 'פרשה זו מופיעה בתורה ומהווה חלק מסיפור התורה',
                    verses: 'פסוקים בתורה',
                    topics: ['נושאים שונים'],
                    fullCommentary: `
                        <h3>פירוש כללי:</h3>
                        <p>פרשת ${parshaName} מהווה חלק חשוב בתורה ונלמדת בבתי הכנסת בכל שבת.</p>
                        <p>הפרשה כוללת לימודים חשובים לאמונה, מוסר והנהגה בעם ישראל.</p>
                    `
                };
            }
            
            // ==================== מודאלים ====================
            
            // הצגת פרטי יום במודאל
            showDayDetails(gregorianDate, parsha, holiday, weekdayName) {
                const hebrewDate = this.getHebrewDate(gregorianDate);
                const gregorianDisplay = gregorianDate.toLocaleDateString('he-IL');
                const dayOfMonth = gregorianDate.getDate();
                const month = gregorianDate.getMonth();
                const year = gregorianDate.getFullYear();
                
                const monthNames = ["ינואר", "פברואר", "מרץ", "אפריל", "מאי", "יוני", 
                                  "יולי", "אוגוסט", "ספטמבר", "אוקטובר", "נובמבר", "דצמבר"];
                
                document.getElementById('day-modal-title').textContent = 
                    `${weekdayName}, ${dayOfMonth} ב${monthNames[month]} ${year}`;
                
                let modalContent = `
                    <div class="day-info-section">
                        <div class="info-item">
                            <div class="info-label">תאריך עברי</div>
                            <div class="info-value">${hebrewDate}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">תאריך לועזי</div>
                            <div class="info-value">${gregorianDisplay}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">יום בשבוע</div>
                            <div class="info-value">${weekdayName}</div>
                        </div>
                    </div>
                `;
                
                if (holiday || parsha) {
                    modalContent += `<div class="day-details">`;
                    
                    if (holiday) {
                        modalContent += `
                            <div class="detail-title">
                                <i class="fas ${holiday.type === 'fast' ? 'fa-moon' : holiday.type === 'rosh-hodesh' ? 'fa-star' : 'fa-star-of-david'}"></i> ${holiday.name}
                            </div>
                            <div class="detail-content">
                                <p>${holiday.desc}</p>
                                ${holiday.type === 'fast' ? '<p><strong>זמני הצום:</strong> מהזריחה עד צאת הכוכבים</p>' : ''}
                                ${holiday.name.includes('ראש חודש') ? '<p><strong>מנהגים:</strong> תפילת הלל, קורבן מוסף, סעודת ראש חודש</p>' : ''}
                                ${holiday.name.includes('חנוכה') ? '<p><strong>מנהגים:</strong> הדלקת נרות, אכילת סופגניות ולביבות</p>' : ''}
                                ${holiday.name.includes('פורים') ? '<p><strong>מנהגים:</strong> קריאת מגילה, משלוח מנות, מתנות לאביונים</p>' : ''}
                            </div>
                        `;
                    }
                    
                    if (parsha) {
                        const parshaInfo = this.getParshaInfo(parsha);
                        modalContent += `
                            <div class="detail-title">
                                <i class="fas fa-torah"></i> פרשת השבוע
                            </div>
                            <div class="detail-content">
                                <p><strong>פרשת ${parsha}</strong></p>
                                <p>${parshaInfo.summary}</p>
                                <p><strong>פסוקים:</strong> ${parshaInfo.verses}</p>
                                <p><strong>נושאים מרכזיים:</strong> ${parshaInfo.topics.join(', ')}</p>
                            </div>
                        `;
                    }
                    
                    modalContent += `</div>`;
                } else {
                    modalContent += `
                        <div class="day-details">
                            <div class="detail-title">
                                <i class="fas fa-info-circle"></i> פרטים נוספים
                            </div>
                            <div class="detail-content">
                                <p>יום זה אינו כולל חגים מיוחדים או פרשת שבוע.</p>
                                <p>התאריך העברי: ${hebrewDate}</p>
                            </div>
                        </div>
                    `;
                }
                
                modalContent += `<div class="actions">`;
                
                if (parsha) {
                    modalContent += `
                        <button class="action-btn parsha-btn" onclick="calendar.showParshaModal('${parsha}')">
                            <i class="fas fa-torah"></i> פירוש מלא לפרשת ${parsha}
                        </button>
                    `;
                }
                
                if (holiday) {
                    const btnClass = holiday.type === 'fast' ? 'fast-btn' : 
                                     holiday.type === 'rosh-hodesh' ? 'holiday-btn' : 'holiday-btn';
                    modalContent += `
                        <button class="action-btn ${btnClass}" onclick="alert('מידע מפורט על ${holiday.name}\\n\\n${holiday.desc}')">
                            <i class="fas ${holiday.type === 'fast' ? 'fa-moon' : holiday.type === 'rosh-hodesh' ? 'fa-star' : 'fa-star-of-david'}"></i> עוד על ${holiday.name}
                        </button>
                    `;
                }
                
                modalContent += `
                    <button class="action-btn" onclick="calendar.closeDayModal()">
                        <i class="fas fa-times"></i> סגירה
                    </button>
                `;
                
                modalContent += `</div>`;
                
                document.getElementById('day-modal-body').innerHTML = modalContent;
                document.getElementById('day-modal').classList.add('active');
            }
            
            // הצגת מודאל פרשה עם פירושים מלאים
            showParshaModal(parshaName) {
                const parshaInfo = this.getParshaInfo(parshaName);
                
                document.getElementById('parsha-modal-title').textContent = `פרשת ${parshaName}`;
                
                document.getElementById('parsha-modal-body').innerHTML = `
                    <div class="parsha-meta">
                        <div class="meta-item">
                            <div class="meta-label">שם הפרשה</div>
                            <div class="meta-value">${parshaName}</div>
                        </div>
                        <div class="meta-item">
                            <div class="meta-label">פסוקים</div>
                            <div class="meta-value">${parshaInfo.verses}</div>
                        </div>
                        <div class="meta-item">
                            <div class="meta-label">נושאים מרכזיים</div>
                            <div class="meta-value">${parshaInfo.topics.slice(0, 3).join(', ')}</div>
                        </div>
                    </div>
                    
                    <div class="parsha-section">
                        <div class="section-title">
                            <i class="fas fa-info-circle"></i> תקציר הפרשה
                        </div>
                        <div class="section-content">
                            <p>${parshaInfo.summary}</p>
                        </div>
                    </div>
                    
                    <div class="parsha-section">
                        <div class="section-title">
                            <i class="fas fa-book-open"></i> פירושים מלאים
                        </div>
                        <div class="section-content">
                            ${parshaInfo.fullCommentary}
                        </div>
                    </div>
                    
                    <div class="actions">
                        <button class="action-btn" onclick="calendar.closeParshaModal()">
                            <i class="fas fa-times"></i> סגירה
                        </button>
                    </div>
                `;
                
                document.getElementById('parsha-modal').classList.add('active');
            }
            
            // ==================== פונקציות ניווט ====================
            
            closeDayModal() {
                document.getElementById('day-modal').classList.remove('active');
            }
            
            closeParshaModal() {
                document.getElementById('parsha-modal').classList.remove('active');
            }
            
            setView(view) {
                document.querySelectorAll('.view-btn').forEach(btn => {
                    btn.classList.remove('active');
                });
                
                event.target.classList.add('active');
                
                document.getElementById('calendar-view').style.display = 'none';
                document.getElementById('holidays-view').classList.remove('active');
                document.getElementById('parshiot-view').classList.remove('active');
                
                switch(view) {
                    case 'calendar':
                        document.getElementById('calendar-view').style.display = 'grid';
                        break;
                    case 'holidays':
                        document.getElementById('holidays-view').classList.add('active');
                        this.updateHolidaysView();
                        break;
                    case 'parshiot':
                        document.getElementById('parshiot-view').classList.add('active');
                        this.updateParshiotView();
                        break;
                }
            }
            
            changeYear(delta) {
                this.displayYear += delta;
                this.updateDisplay();
            }
            
            goToYear() {
                const input = document.getElementById('yearInput');
                const year = parseInt(input.value);
                
                if (year >= 5700 && year <= 5900) {
                    this.displayYear = year;
                    this.updateDisplay();
                } else {
                    alert('נא להכניס שנה עברית בין 5700 ל-5900');
                }
            }
            
            updateDisplay() {
                this.updateYearDisplay();
                this.renderCalendar();
                this.updateHolidaysView();
                this.updateParshiotView();
            }
            
            setupEventListeners() {
                document.getElementById('day-modal').addEventListener('click', (e) => {
                    if (e.target === document.getElementById('day-modal')) {
                        this.closeDayModal();
                    }
                });
                
                document.getElementById('parsha-modal').addEventListener('click', (e) => {
                    if (e.target === document.getElementById('parsha-modal')) {
                        this.closeParshaModal();
                    }
                });
                
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        this.closeDayModal();
                        this.closeParshaModal();
                    }
                });
            }
        }
        
        // ==================== אתחול האפליקציה ====================
        
        let calendar;
        
        document.addEventListener('DOMContentLoaded', () => {
            calendar = new HebrewCalendarCalculator();
            
            // הגדרת פונקציות גלובליות
            window.changeYear = (delta) => calendar.changeYear(delta);
            window.goToYear = () => calendar.goToYear();
            window.setView = (view) => calendar.setView(view);
            window.showParshaModal = (parshaName) => calendar.showParshaModal(parshaName);
            window.closeDayModal = () => calendar.closeDayModal();
            window.closeParshaModal = () => calendar.closeParshaModal();
            
            // הפיכת אובייקט הקלנדר לגלובלי לנוחיות
            window.calendar = calendar;
        });
    </script>
</body>
</html>
